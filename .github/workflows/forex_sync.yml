name: Sync Forex Calendar
on:
  schedule:
    # Runs at 01:00 UTC (2:00 AM Lagos time) every Monday
    - cron: '45 13 * * 0'
  workflow_dispatch: # Allows you to also run it manually via a button
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas requests
      - name: Run automation script
        run: python economic_calendar.py
